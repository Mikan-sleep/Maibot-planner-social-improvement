name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: ruff check plugin.py planner_social tests scripts experiments
      - name: Test
        run: python -m pytest
      - name: Validate plugin metadata
        run: python scripts/validate_plugin.py
      - name: Build release artifact
        run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error
